<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, 'Segoe UI', 'Helvetica Neue', sans-serif">
  <title>Pattern taxonomy — state vs. stream count</title>
  <rect width="1600" height="900" fill="#FFFFFF"/>

  <text x="80" y="72" font-size="30" font-weight="600" fill="#173A6C">The catalog at a glance</text>
  <text x="80" y="102" font-size="17" fill="#5A6572">Fourteen patterns, two axes: how much state, how many streams.</text>

  <!-- quadrant fills -->
  <rect x="260" y="140" width="610" height="290" fill="#F4F6F8"/>
  <rect x="870" y="140" width="610" height="290" fill="#EAF1FA" opacity="0.55"/>
  <rect x="260" y="430" width="610" height="290" fill="#FFFFFF"/>
  <rect x="870" y="430" width="610" height="290" fill="#F4F6F8"/>

  <!-- faint cost diagonal, behind the chips -->
  <g opacity="0.14">
    <line x1="300" y1="700" x2="1409" y2="180" stroke="#0074E4" stroke-width="14" stroke-linecap="round"/>
    <polygon points="1440,165 1414.3,190.4 1404.1,168.6" fill="#0074E4"/>
  </g>

  <!-- grid frame -->
  <rect x="260" y="140" width="1220" height="580" fill="none" stroke="#5A6572" stroke-width="1.5"/>
  <line x1="870" y1="140" x2="870" y2="720" stroke="#5A6572" stroke-width="1" stroke-dasharray="5 5"/>
  <line x1="260" y1="430" x2="1480" y2="430" stroke="#5A6572" stroke-width="1" stroke-dasharray="5 5"/>

  <!-- axes -->
  <text x="870" y="772" font-size="16" font-weight="600" fill="#173A6C" text-anchor="middle">Single stream  →  Multi-stream / joined</text>
  <text x="0" y="0" font-size="16" font-weight="600" fill="#173A6C" text-anchor="middle" transform="translate(196,430) rotate(-90)">Stateless  →  Stateful</text>

  <!-- quadrant captions -->
  <text x="285" y="168" font-size="12" font-weight="600" fill="#5A6572" letter-spacing="0.6">STATEFUL · SINGLE STREAM</text>
  <text x="895" y="168" font-size="12" font-weight="600" fill="#5A6572" letter-spacing="0.6">STATEFUL · JOINED</text>
  <text x="285" y="458" font-size="12" font-weight="600" fill="#5A6572" letter-spacing="0.6">STATELESS · SINGLE STREAM</text>
  <text x="895" y="458" font-size="12" font-weight="600" fill="#5A6572" letter-spacing="0.6">STATELESS · JOINED</text>

  <g font-size="15.5" fill="#173A6C">
    <!-- top-left: stateful, single stream -->
    <rect x="300" y="182" width="250" height="44" rx="8" fill="#FFFFFF" stroke="#0074E4" stroke-width="1.5"/>
    <text x="425" y="210" text-anchor="middle">Dedup</text>
    <rect x="300" y="236" width="250" height="44" rx="8" fill="#FFFFFF" stroke="#0074E4" stroke-width="1.5"/>
    <text x="425" y="264" text-anchor="middle">Windowed aggregate</text>
    <rect x="300" y="290" width="250" height="44" rx="8" fill="#FFFFFF" stroke="#0074E4" stroke-width="1.5"/>
    <text x="425" y="318" text-anchor="middle">Retry ladder</text>

    <!-- top-right: stateful, joined -->
    <rect x="910" y="182" width="270" height="44" rx="8" fill="#FFFFFF" stroke="#0074E4" stroke-width="1.5"/>
    <text x="1045" y="210" text-anchor="middle">Stream–table join</text>
    <rect x="910" y="236" width="270" height="44" rx="8" fill="#FFFFFF" stroke="#0074E4" stroke-width="1.5"/>
    <text x="1045" y="264" text-anchor="middle">Temporal join</text>
    <rect x="910" y="290" width="270" height="44" rx="8" fill="#FFFFFF" stroke="#0074E4" stroke-width="1.5"/>
    <text x="1045" y="318" text-anchor="middle">Saga / process manager</text>
    <rect x="910" y="344" width="270" height="44" rx="8" fill="#FFFFFF" stroke="#00A6A0" stroke-width="1.5"/>
    <text x="1045" y="372" text-anchor="middle">Outbox / CDC ingress</text>

    <!-- bottom-left: stateless, single stream -->
    <rect x="300" y="470" width="250" height="40" rx="8" fill="#FFFFFF" stroke="#0074E4" stroke-width="1.5"/>
    <text x="425" y="496" text-anchor="middle">Filter</text>
    <rect x="300" y="520" width="250" height="40" rx="8" fill="#FFFFFF" stroke="#0074E4" stroke-width="1.5"/>
    <text x="425" y="546" text-anchor="middle">Transform</text>
    <rect x="300" y="570" width="250" height="40" rx="8" fill="#FFFFFF" stroke="#0074E4" stroke-width="1.5"/>
    <text x="425" y="596" text-anchor="middle">Route</text>
    <rect x="300" y="620" width="250" height="40" rx="8" fill="#FFFFFF" stroke="#0074E4" stroke-width="1.5"/>
    <text x="425" y="646" text-anchor="middle">Split</text>
    <rect x="300" y="670" width="250" height="40" rx="8" fill="#E3F5F4" stroke="#00A6A0" stroke-width="2"/>
    <text x="425" y="696" text-anchor="middle" font-weight="600">Share-group worker</text>

    <!-- bottom-right: stateless, joined -->
    <rect x="910" y="472" width="270" height="44" rx="8" fill="#FFFFFF" stroke="#0074E4" stroke-width="1.5"/>
    <text x="1045" y="500" text-anchor="middle">Static enrich</text>
    <rect x="910" y="526" width="270" height="44" rx="8" fill="#FFFFFF" stroke="#0074E4" stroke-width="1.5"/>
    <text x="1045" y="554" text-anchor="middle">Claim check</text>
  </g>

  <!-- share-group footnote, beside the chip, inside its own quadrant -->
  <line x1="554" y1="690" x2="580" y2="690" stroke="#00A6A0" stroke-width="1.4"/>
  <text x="590" y="684" font-size="13.5" fill="#00A6A0" font-style="italic">no state, no EOS, no key order —</text>
  <text x="590" y="704" font-size="13.5" fill="#00A6A0" font-style="italic">this chip cannot move up or right</text>

  <!-- legend strip -->
  <g transform="translate(260,822)">
    <g opacity="0.3">
      <line x1="0" y1="0" x2="68" y2="0" stroke="#0074E4" stroke-width="11" stroke-linecap="round"/>
      <polygon points="90,0 68,-9 68,9" fill="#0074E4"/>
    </g>
    <text x="112" y="5" font-size="15.5" fill="#173A6C">Operational cost rises along the diagonal — state × join complexity. Priced on the next slide.</text>
  </g>
</svg>
