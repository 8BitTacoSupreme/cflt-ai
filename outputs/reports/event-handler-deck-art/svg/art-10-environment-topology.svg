<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, 'Segoe UI', 'Helvetica Neue', sans-serif">
  <title>Environment topology — everything as code</title>
  <defs>
    <marker id="a10" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A6572"/>
    </marker>
    <marker id="a10t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#00A6A0"/>
    </marker>
    <!-- body first, then the top ellipse over it, so it reads as a cylinder -->
    <g id="cyl">
      <path d="M-44 0 v50 a44 11 0 0 0 88 0 v-50" fill="#E3F5F4" stroke="#00A6A0" stroke-width="1.4"/>
      <ellipse cx="0" cy="0" rx="44" ry="11" fill="#FFFFFF" stroke="#00A6A0" stroke-width="1.4"/>
    </g>
  </defs>
  <rect width="1600" height="900" fill="#FFFFFF"/>

  <!-- CI/CD band -->
  <rect x="100" y="46" width="1400" height="52" rx="8" fill="#EAF1FA" stroke="#0074E4" stroke-width="1.5"/>
  <text x="126" y="78" font-size="16" font-weight="600" fill="#173A6C">CI/CD pipeline</text>
  <line x1="330" y1="72" x2="1440" y2="72" stroke="#0074E4" stroke-width="1.5" marker-end="url(#a10)"/>
  <text x="880" y="64" font-size="14" fill="#0074E4" text-anchor="middle" font-style="italic">same artifact, different config</text>

  <!-- cluster link, prod -> stage -->
  <path d="M1270 158 C 1270 128, 800 128, 800 158" fill="none" stroke="#00A6A0" stroke-width="2" stroke-dasharray="8 5" marker-end="url(#a10t)"/>
  <text x="1035" y="124" font-size="14.5" font-weight="600" fill="#00A6A0" text-anchor="middle">Cluster Link — masked subset</text>

  <!-- environment shells -->
  <rect x="100" y="175" width="440" height="480" rx="12" fill="#F4F6F8" stroke="#5A6572" stroke-width="1.5"/>
  <text x="126" y="212" font-size="19" font-weight="700" fill="#173A6C" letter-spacing="1.2">DEV</text>
  <text x="126" y="234" font-size="13" fill="#5A6572">Confluent Cloud Environment</text>

  <rect x="570" y="175" width="440" height="480" rx="12" fill="#F4F6F8" stroke="#5A6572" stroke-width="1.5"/>
  <text x="596" y="212" font-size="19" font-weight="700" fill="#173A6C" letter-spacing="1.2">STAGE</text>
  <text x="596" y="234" font-size="13" fill="#5A6572">Confluent Cloud Environment</text>

  <rect x="1040" y="175" width="440" height="480" rx="12" fill="#EAF1FA" stroke="#173A6C" stroke-width="2.5"/>
  <text x="1066" y="212" font-size="19" font-weight="700" fill="#173A6C" letter-spacing="1.2">PROD</text>
  <text x="1066" y="234" font-size="13" fill="#5A6572">Confluent Cloud Environment</text>
  <g transform="translate(1418,192)">
    <rect x="0" y="9" width="26" height="20" rx="3" fill="#173A6C"/>
    <path d="M5 9 V5 a8 8 0 0 1 16 0 V9" fill="none" stroke="#173A6C" stroke-width="3"/>
    <text x="13" y="46" font-size="11" fill="#173A6C" text-anchor="middle">private</text>
  </g>

  <!-- DEV contents -->
  <g font-size="14.5" fill="#173A6C">
    <rect x="132" y="256" width="376" height="58" rx="7" fill="#FFFFFF" stroke="#0074E4" stroke-width="1.5"/>
    <text x="320" y="291" text-anchor="middle">Kafka cluster</text>
    <rect x="132" y="326" width="376" height="52" rx="7" fill="#FFFFFF" stroke="#0074E4" stroke-width="1.5"/>
    <text x="320" y="358" text-anchor="middle">Schema Registry</text>
    <rect x="132" y="390" width="376" height="52" rx="7" fill="#FFFFFF" stroke="#0074E4" stroke-width="1.5"/>
    <text x="320" y="422" text-anchor="middle">Flink compute pool</text>
    <use href="#cyl" x="196" y="492"/>
    <use href="#cyl" x="320" y="492"/>
    <use href="#cyl" x="444" y="492"/>
    <text x="320" y="600" font-size="13" fill="#5A6572" text-anchor="middle">topics — namespaced per branch</text>
  </g>

  <!-- STAGE contents -->
  <g font-size="14.5" fill="#173A6C">
    <rect x="602" y="256" width="376" height="58" rx="7" fill="#FFFFFF" stroke="#0074E4" stroke-width="1.5"/>
    <text x="790" y="291" text-anchor="middle">Kafka cluster</text>
    <rect x="602" y="326" width="376" height="52" rx="7" fill="#FFFFFF" stroke="#0074E4" stroke-width="1.5"/>
    <text x="790" y="358" text-anchor="middle">Schema Registry</text>
    <rect x="602" y="390" width="376" height="52" rx="7" fill="#FFFFFF" stroke="#0074E4" stroke-width="1.5"/>
    <text x="790" y="422" text-anchor="middle">Flink compute pool</text>
    <use href="#cyl" x="666" y="492"/>
    <use href="#cyl" x="790" y="492"/>
    <use href="#cyl" x="914" y="492"/>
    <text x="790" y="600" font-size="13" fill="#5A6572" text-anchor="middle">topics — masked subset from prod</text>
  </g>

  <!-- PROD contents -->
  <g font-size="14.5" fill="#173A6C">
    <rect x="1072" y="256" width="376" height="58" rx="7" fill="#FFFFFF" stroke="#173A6C" stroke-width="2"/>
    <text x="1260" y="291" text-anchor="middle">Kafka cluster</text>
    <rect x="1072" y="326" width="376" height="52" rx="7" fill="#FFFFFF" stroke="#173A6C" stroke-width="2"/>
    <text x="1260" y="358" text-anchor="middle">Schema Registry</text>
    <rect x="1072" y="390" width="376" height="52" rx="7" fill="#FFFFFF" stroke="#173A6C" stroke-width="2"/>
    <text x="1260" y="422" text-anchor="middle">Flink compute pool</text>
    <use href="#cyl" x="1136" y="492"/>
    <use href="#cyl" x="1260" y="492"/>
    <use href="#cyl" x="1384" y="492"/>
    <text x="1260" y="600" font-size="13" fill="#5A6572" text-anchor="middle">topics — system of record</text>
  </g>

  <!-- terraform bar -->
  <g stroke="#5A6572" stroke-width="1.5" marker-end="url(#a10)">
    <line x1="320" y1="742" x2="320" y2="662"/>
    <line x1="790" y1="742" x2="790" y2="662"/>
    <line x1="1260" y1="742" x2="1260" y2="662"/>
  </g>
  <rect x="100" y="748" width="1400" height="62" rx="8" fill="#173A6C"/>
  <text x="800" y="786" font-size="17.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Terraform (Confluent provider) — single source of truth</text>
  <text x="800" y="848" font-size="15" fill="#5A6572" text-anchor="middle">Clusters, topics, schemas, ACLs, connectors, Flink statements, service accounts. If it isn't here, it isn't a deployment.</text>
</svg>
