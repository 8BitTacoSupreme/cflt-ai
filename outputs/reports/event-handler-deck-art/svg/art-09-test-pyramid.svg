<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, 'Segoe UI', 'Helvetica Neue', sans-serif">
  <title>The streaming test pyramid</title>
  <defs>
    <linearGradient id="costBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#173A6C"/>
      <stop offset="100%" stop-color="#D6E3F2"/>
    </linearGradient>
    <marker id="lead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A6572"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#FFFFFF"/>

  <text x="80" y="66" font-size="30" font-weight="600" fill="#173A6C">The streaming test pyramid</text>
  <text x="80" y="96" font-size="17" fill="#5A6572">Most streaming teams have an hourglass. We want a pyramid.</text>

  <!-- tiers, base to apex -->
  <polygon points="508,634 1052,634 1120,760 440,760" fill="#EAF1FA" stroke="#0074E4" stroke-width="1.5"/>
  <polygon points="576,508 984,508 1052,634 508,634" fill="#E3F5F4" stroke="#00A6A0" stroke-width="2"/>
  <polygon points="644,382 916,382 984,508 576,508" fill="#EAF1FA" stroke="#0074E4" stroke-width="1.5"/>
  <polygon points="712,256 848,256 916,382 644,382" fill="#EAF1FA" stroke="#0074E4" stroke-width="1.5"/>
  <polygon points="780,130 848,256 712,256" fill="#D6E3F2" stroke="#173A6C" stroke-width="1.5"/>

  <!-- tier labels, left, with leaders -->
  <g font-size="16" fill="#173A6C" text-anchor="end">
    <text x="400" y="694" font-weight="600">Unit</text>
    <text x="400" y="716" font-size="13.5" fill="#5A6572">topology test driver / Flink table tests</text>
    <text x="400" y="736" font-size="13" fill="#5A6572" font-style="italic">thousands, milliseconds</text>

    <text x="400" y="565" font-weight="600" fill="#00A6A0">Contract</text>
    <text x="400" y="587" font-size="13.5" fill="#5A6572">schema compatibility gate</text>
    <text x="400" y="607" font-size="13" fill="#00A6A0" font-style="italic">runs on every commit</text>

    <text x="400" y="440" font-weight="600">Component</text>
    <text x="400" y="462" font-size="13.5" fill="#5A6572">containerized broker + Schema Registry,</text>
    <text x="400" y="480" font-size="13.5" fill="#5A6572">one handler, real serialization</text>

    <text x="400" y="314" font-weight="600">Integration</text>
    <text x="400" y="336" font-size="13.5" fill="#5A6572">ephemeral namespaced topics on a</text>
    <text x="400" y="354" font-size="13.5" fill="#5A6572">real Confluent Cloud environment</text>

    <text x="400" y="190" font-weight="600">Non-functional</text>
    <text x="400" y="212" font-size="13.5" fill="#5A6572">lag, rebalance, failover, poison pill</text>
    <text x="400" y="232" font-size="13" fill="#5A6572" font-style="italic">nightly / pre-release</text>
  </g>
  <g stroke="#5A6572" stroke-width="1" marker-end="url(#lead)">
    <line x1="412" y1="690" x2="470" y2="690"/>
    <line x1="412" y1="561" x2="539" y2="561"/>
    <line x1="412" y1="436" x2="607" y2="436"/>
    <line x1="412" y1="310" x2="675" y2="310"/>
    <line x1="412" y1="186" x2="742" y2="186"/>
  </g>

  <!-- cost / runtime bar -->
  <rect x="1180" y="130" width="30" height="630" rx="4" fill="url(#costBar)"/>
  <text x="0" y="0" font-size="14" font-weight="600" fill="#5A6572" text-anchor="middle" transform="translate(1240,445) rotate(90)">cost / runtime  →</text>

  <!-- ghost hourglass, what most teams have -->
  <polygon points="1320,250 1550,250 1452,470 1550,690 1320,690 1418,470"
           fill="#F4F6F8" stroke="#B8C2CC" stroke-width="1.5" stroke-dasharray="7 5"/>
  <g fill="#5A6572" font-size="12.5" text-anchor="middle" opacity="0.75">
    <text x="1435" y="300">many slow end-to-end tests</text>
    <text x="1435" y="478">little in the middle</text>
    <text x="1435" y="660">few real unit tests</text>
  </g>
  <!-- rejection badge, kept small so it does not fight the shape -->
  <circle cx="1546" cy="256" r="24" fill="#FFFFFF" stroke="#C0392B" stroke-width="3"/>
  <g stroke="#C0392B" stroke-width="4" stroke-linecap="round">
    <line x1="1537" y1="247" x2="1555" y2="265"/>
    <line x1="1555" y1="247" x2="1537" y2="265"/>
  </g>
  <text x="1435" y="730" font-size="14" fill="#5A6572" text-anchor="middle" font-style="italic">what most teams</text>
  <text x="1435" y="750" font-size="14" fill="#5A6572" text-anchor="middle" font-style="italic">actually have</text>

  <text x="80" y="838" font-size="15.5" fill="#173A6C">The contract gate sits second on purpose — it is the cheapest check in the stack, so it runs earliest and most often.</text>
</svg>
