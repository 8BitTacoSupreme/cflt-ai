# =============================================================================
# cfk-operator-values.yaml — Confluent for Kubernetes operator (s390x)
# =============================================================================
#   helm repo add confluentinc https://packages.confluent.io/helm
#   helm upgrade --install confluent-operator \
#     confluentinc/confluent-for-kubernetes \
#     -n confluent --create-namespace -f cfk-operator-values.yaml
#
# CFK is supported on s390x from CP 8.2.0 (confluent-docs, "Linux on IBM Z
# (s390x) support"). Pin >= 8.2.0 — earlier CP has no s390x artifacts at all.
# Entitled as IBM Confluent Platform for Z and LinuxONE (GA 2026-03-17).
#
# Support-matrix posture (see ../README.md §1): confluent-docs lists FIPS mode,
# IPv6, USM Agent, and native-lib connectors as "not yet supported on s390x".
# These are CP-layer statements and the public matrix lags actual state; status
# is confirmed with IBM/Confluent before deployment and recorded in the
# BOM. FIPS mode is ENABLED below on that basis.
# =============================================================================

# Single-namespace scope keeps RBAC tight and matches the FlinkEnvironment's
# kubernetesNamespace. Cluster-wide operators are a needless blast radius in FSI.
namespaceed: true

image:
  registry: docker.io
  repository: confluentinc/confluent-operator
  # Pin exactly. `latest` on a mixed-arch registry is how you silently pull amd64.
  tag: 3.2.0

# Every pod this operator schedules must land on s390x. Without this an
# admission-time mistake becomes a CrashLoopBackOff at 3am.
nodeSelector:
  kubernetes.io/arch: s390x

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/arch
              operator: In
              values: [s390x]

# The operator itself is light; it is a control-plane pod, not a data-plane one.
resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

# Emit operator metrics for the Prometheus stack (helm/kube-prometheus-stack-values.yaml).
metrics:
  prometheus:
    enabled: true

# OpenShift: CFK pods run under the restricted-v2 SCC. Do not grant privileged.
podSecurity:
  enabled: true

# CP FIPS mode: BC-FIPS provider + BCFKS keystores. Pure Java — enabling this on Z
# is configuration + certification sequencing, not architecture. Requires the host
# to be booted with fips=1 (verified by ansible/02-fips-mode.yml) and BCFKS
# keystores staged (generated by the same play).
#
# Equivalent to: helm ... --set fipsmode=true
fipsmode: true

